name: ci

on:
  # Run once on PRs (the pull_request event) and once on merges to main (the
  # push event). Restricting push to main means feature-branch commits no longer
  # trigger a duplicate push run alongside the pull_request run.
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit supersedes it on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt · clippy · test · audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: install linux deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libssl-dev pkg-config lld

      # Fail-fast order: cheap, deterministic checks first.
      - name: format check
        run: cargo fmt --all -- --check

      - name: version consistency
        run: cargo run -q -p xtask -- check-versions

      # Keep this flag set in sync with scripts/pre-commit.sh — it is the
      # single curated allow list (each entry justified there). Notably:
      # duration_suboptimal_units suggests APIs newer than the MSRV (1.82),
      # and wildcard_imports conflicts with the repo's `use super::*;`
      # module-split idiom.
      - name: clippy (pedantic, warnings as errors)
        run: >
          cargo clippy --workspace --all-targets --
          -D warnings -W clippy::pedantic
          -A clippy::module_name_repetitions
          -A clippy::must_use_candidate
          -A clippy::cast_precision_loss
          -A clippy::cast_possible_truncation
          -A clippy::cast_sign_loss
          -A clippy::cast_possible_wrap
          -A clippy::missing_panics_doc
          -A clippy::many_single_char_names
          -A clippy::similar_names
          -A clippy::items_after_statements
          -A clippy::doc_markdown
          -A clippy::implicit_clone
          -A clippy::map_unwrap_or
          -A clippy::needless_pass_by_value
          -A clippy::type_complexity
          -A clippy::struct_excessive_bools
          -A clippy::fn_params_excessive_bools
          -A clippy::trivially_copy_pass_by_ref
          -A clippy::duration_suboptimal_units
          -A clippy::wildcard_imports

      - name: test (whole workspace, incl. term/)
        run: cargo test --workspace --all-targets

      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      # Advisories fail the build. Time-boxed suppressions use a single
      # `--ignore` each with a tracking note, never a blanket disable.
      #
      # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel, medium): pulled in
      # transitively by russh; no fixed rsa release is available yet. Tracked —
      # drop this ignore once russh ships a patched rsa.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
